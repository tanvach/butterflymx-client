      .add({targets:subtitle,keyframes:[{translateY:-41,easing:'cubicBezier(0.42,0,0.58,1)',duration:0},{translateY:-41,easing:'cubicBezier(0.42,0,0.58,1)',duration:2600},{translateY:0,easing:'cubicBezier(0.00974,0.8,0.19026,1)',duration:1000}]},0)
      .add({targets:subtitle,keyframes:[{opacity:0,easing:'cubicBezier(0.42,0,0.58,1)',duration:0},{opacity:0,easing:'cubicBezier(0.42,0,0.58,1)',duration:2600},{opacity:0.5,easing:'cubicBezier(0.42,0,0.58,1)',duration:1000}]},0);
  })();
  document.querySelectorAll('.toggle-pw').forEach(function(btn){
    btn.addEventListener('click',function(){
      var wrap=btn.closest('.relative');
      var input=wrap.querySelector('input');
      var show=wrap.querySelector('.icon-show');
      var hide=wrap.querySelector('.icon-hide');
      if(input.type==='password'){input.type='text';show.classList.remove('hidden');hide.classList.add('hidden');}
      else{input.type='password';show.classList.add('hidden');hide.classList.remove('hidden');}
    });
  });
  // Replacements for inline handler attributes, which helmet's default
  // script-src-attr 'none' blocks: confirm-gated forms, flash-banner
  // dismissal, and the TOTP-secret Copy button.
  document.querySelectorAll('form[data-confirm]').forEach(function(form){
    form.addEventListener('submit',function(e){
      if(!confirm(form.getAttribute('data-confirm'))) e.preventDefault();
    });
  });
  document.querySelectorAll('[data-flash] [data-dismiss]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var banner=btn.closest('[data-flash]');
      if(banner) banner.remove();
    });
  });
  document.querySelectorAll('[data-clipboard]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var el=document.querySelector('[data-totp-secret]');
      if(el&&navigator.clipboard) navigator.clipboard.writeText(el.textContent.trim());
    });
  });
  </script>
